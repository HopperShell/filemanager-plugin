filetype: filemanager

detect:
    filename: "^filemanager$"

rules:
    # Current directory path (first line)
    - identifier: "^/.*$"
    # Separator line
    - comment: "^─+$"
    # Parent directory navigation
    - special: "^\\.\\.$"
    # Directories with +/- indicators
    - special: "^\\s*(●\\s*)?[\\+\\-]\\s+.*/$"
    # Selected marker
    - constant.string: "●"
